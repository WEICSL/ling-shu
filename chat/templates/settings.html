<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>系统设置 · 灵枢</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				font-family: 'Microsoft YaHei', sans-serif;
			}

			.container {
				max-width: 1000px;
				margin: 0 auto;
				padding: 30px 20px;
			}

			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 30px;
			}

			.header h1 {
				color: white;
				font-size: 28px;
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.back-btn {
				padding: 10px 20px;
				background: rgba(255, 255, 255, 0.2);
				color: white;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				font-size: 14px;
				transition: all 0.3s;
			}

			.back-btn:hover {
				background: rgba(255, 255, 255, 0.3);
				transform: translateY(-2px);
			}

			.settings-card {
				background: rgba(255, 255, 255, 0.95);
				border-radius: 20px;
				overflow: hidden;
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
			}

			.settings-tabs {
				display: flex;
				flex-wrap: wrap;
				background: #f8f9fa;
				border-bottom: 1px solid #eee;
			}

			.tab-btn {
				flex: 1;
				padding: 16px 20px;
				background: none;
				border: none;
				font-size: 14px;
				cursor: pointer;
				transition: all 0.3s;
				color: #666;
			}

			.tab-btn.active {
				background: white;
				color: #667eea;
				border-bottom: 2px solid #667eea;
			}

			.tab-pane {
				display: none;
				padding: 30px;
			}

			.tab-pane.active {
				display: block;
			}

			.form-group {
				margin-bottom: 24px;
			}

			.form-group label {
				display: block;
				margin-bottom: 8px;
				font-weight: bold;
				color: #333;
			}

			.form-group input[type="text"],
			.form-group input[type="password"],
			.form-group select,
			.form-group textarea {
				width: 100%;
				padding: 12px 15px;
				border: 1px solid #ddd;
				border-radius: 10px;
				font-size: 14px;
				transition: all 0.3s;
			}

			.form-group textarea {
				resize: vertical;
			}

			.form-group input:focus,
			.form-group select:focus,
			.form-group textarea:focus {
				outline: none;
				border-color: #667eea;
				box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
			}

			.checkbox-group {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.checkbox-group input {
				width: 20px;
				height: 20px;
				cursor: pointer;
			}

			.checkbox-group label {
				margin-bottom: 0;
				cursor: pointer;
			}

			.help-text {
				font-size: 12px;
				color: #999;
				margin-top: 5px;
			}

			.btn-save {
				background: #667eea;
				color: white;
				border: none;
				padding: 12px 30px;
				border-radius: 10px;
				cursor: pointer;
				font-size: 16px;
				transition: all 0.3s;
				margin-top: 10px;
			}

			.btn-save:hover {
				background: #5a67d8;
				transform: translateY(-2px);
			}

			.btn-test {
				background: #28a745;
				color: white;
				border: none;
				padding: 8px 16px;
				border-radius: 8px;
				cursor: pointer;
				font-size: 13px;
				margin-left: 10px;
			}

			.toast {
				position: fixed;
				bottom: 20px;
				right: 20px;
				background: #333;
				color: white;
				padding: 12px 20px;
				border-radius: 8px;
				z-index: 10000;
				animation: slideIn 0.3s ease;
			}

			@keyframes slideIn {
				from {
					transform: translateX(100%);
					opacity: 0;
				}

				to {
					transform: translateX(0);
					opacity: 1;
				}
			}

			.modal {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.5);
				z-index: 1000;
				justify-content: center;
				align-items: center;
			}

			.modal-content {
				background: white;
				border-radius: 15px;
				width: 500px;
				max-width: 90%;
				max-height: 80%;
				overflow: auto;
			}

			.modal-header {
				padding: 20px;
				background: linear-gradient(135deg, #667eea, #764ba2);
				color: white;
				display: flex;
				justify-content: space-between;
				align-items: center;
				border-radius: 15px 15px 0 0;
			}

			.modal-header h3 {
				margin: 0;
			}

			.close-modal {
				background: none;
				border: none;
				color: white;
				font-size: 24px;
				cursor: pointer;
			}

			.modal-body {
				padding: 20px;
			}

			.stat-card {
				background: linear-gradient(135deg, #667eea, #764ba2);
				border-radius: 15px;
				padding: 20px;
				color: white;
				text-align: center;
			}

			.prompt-card {
				background: #f8f9fa;
				border-radius: 12px;
				padding: 15px;
				border-left: 4px solid #667eea;
			}

			.category-badge {
				background: #e9ecef;
				padding: 2px 8px;
				border-radius: 12px;
				font-size: 11px;
			}

			.icon-btn {
				padding: 4px 10px;
				border: none;
				border-radius: 6px;
				cursor: pointer;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1><span>⚙️</span> 系统设置</h1>
				<button class="back-btn" onclick="window.location.href='/'">← 返回主界面</button>
			</div>

			<div class="settings-card">
				<div class="settings-tabs">
					<button class="tab-btn active" data-tab="general">⚙️ 通用设置</button>
					<button class="tab-btn" data-tab="api">🔑 API 配置</button>
					<button class="tab-btn" data-tab="model">🤖 模型设置</button>
					<button class="tab-btn" data-tab="theme">🎨 界面主题</button>
					<button class="tab-btn" data-tab="stats">📊 统计看板</button>
					<button class="tab-btn" data-tab="prompts">📖 提示词库</button>
				</div>

				<!-- 通用设置 -->
				<div class="tab-pane active" id="tab-general">
					<div class="form-group">
						<label>🌐 项目名称</label>
						<input type="text" id="project-name" placeholder="灵枢">
						<div class="help-text">显示在浏览器标签页和顶栏的名称</div>
					</div>
					<div class="form-group">
						<label>💬 默认问候语</label>
						<input type="text" id="default-greeting" placeholder="你好！很高兴为你服务">
						<div class="help-text">新建对话时的欢迎语</div>
					</div>
					<div class="form-group">
						<div class="checkbox-group">
							<input type="checkbox" id="auto-save">
							<label>自动保存对话历史</label>
						</div>
						<div class="help-text">关闭后，对话不会自动保存到数据库</div>
					</div>
					<div class="form-group">
						<div class="checkbox-group">
							<input type="checkbox" id="stream-mode">
							<label>流式输出模式</label>
						</div>
						<div class="help-text">逐字显示AI回复，关闭则一次性显示完整内容</div>
					</div>
				</div>

				<!-- API 配置 -->
				<div class="tab-pane" id="tab-api">
					<div class="form-group">
						<label>🔑 DeepSeek API Key</label>
						<input type="password" id="deepseek-api-key" placeholder="sk-...">
						<div class="help-text">
							获取地址：<a href="https://platform.deepseek.com/" target="_blank">platform.deepseek.com</a>
							<button class="btn-test" onclick="testApiKey('deepseek')">测试连接</button>
						</div>
					</div>
					<div class="form-group">
						<label>🤖 默认模型</label>
						<select id="default-model">
							<option value="deepseek-chat">DeepSeek (云端)</option>
							<option value="qwen2:7b">qwen2:7b (本地)</option>
							<option value="qwen3-vl:8b">qwen3-vl:8b (本地)</option>
						</select>
						<div class="help-text">新建会话时默认使用的模型</div>
					</div>
					<div class="form-group">
						<div class="checkbox-group">
							<input type="checkbox" id="enable-agent">
							<label>默认启用 Agent 模式</label>
						</div>
						<div class="help-text">启用后，新建对话默认开启工具调用功能</div>
					</div>
				</div>

				<!-- 模型设置 -->
				<div class="tab-pane" id="tab-model">
					<div class="form-group">
						<label>🌡️ 温度参数 (Temperature)</label>
						<input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
						<span id="temperature-value" style="margin-left: 10px;">0.7</span>
						<div class="help-text">值越高回答越随机，越低越确定</div>
					</div>
					<div class="form-group">
						<label>📊 Top-P 采样</label>
						<input type="range" id="top-p" min="0" max="1" step="0.05" value="0.9">
						<span id="top-p-value" style="margin-left: 10px;">0.9</span>
						<div class="help-text">核采样参数，影响回答多样性</div>
					</div>
					<div class="form-group">
						<label>📝 最大输出长度</label>
						<select id="max-tokens">
							<option value="512">512 tokens</option>
							<option value="1024" selected>1024 tokens</option>
							<option value="2048">2048 tokens</option>
							<option value="4096">4096 tokens</option>
						</select>
					</div>
				</div>

				<!-- 界面主题 -->
				<div class="tab-pane" id="tab-theme">
					<div class="form-group">
						<label>🎨 主题颜色</label>
						<select id="theme-color">
							<option value="purple">紫色渐变 (默认)</option>
							<option value="blue">蓝色渐变</option>
							<option value="green">绿色渐变</option>
							<option value="dark">深色模式</option>
						</select>
					</div>
					<div class="form-group">
						<label>💬 消息气泡样式</label>
						<select id="bubble-style">
							<option value="rounded">圆角气泡</option>
							<option value="sharp">直角气泡</option>
							<option value="modern">现代风格</option>
						</select>
					</div>
					<div class="form-group">
						<div class="checkbox-group">
							<input type="checkbox" id="code-highlight">
							<label>启用代码高亮</label>
						</div>
					</div>
				</div>

				<!-- 统计看板 -->
				<div class="tab-pane" id="tab-stats">
					<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
						<div class="stat-card" style="background: linear-gradient(135deg, #667eea, #764ba2);">
							<div style="font-size: 32px; margin-bottom: 8px;" id="stat-total-chats">0</div>
							<div style="font-size: 14px;">总对话数</div>
						</div>
						<div class="stat-card" style="background: linear-gradient(135deg, #11998e, #38ef7d);">
							<div style="font-size: 32px; margin-bottom: 8px;" id="stat-total-messages">0</div>
							<div style="font-size: 14px;">总消息数</div>
						</div>
						<div class="stat-card" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
							<div style="font-size: 32px; margin-bottom: 8px;" id="stat-average-length">0</div>
							<div style="font-size: 14px;">平均消息长度</div>
						</div>
					</div>
					<div style="background: #f8f9fa; border-radius: 15px; padding: 20px;">
						<h3 style="margin-bottom: 15px; color: #333;">📈 最近7天对话趋势</h3>
						<canvas id="chat-chart" width="800" height="200" style="width:100%; height:200px;"></canvas>
					</div>
					<div style="margin-top: 20px; display: flex; justify-content: center;">
						<button class="btn-save" onclick="refreshStats()" style="background: #667eea;">🔄 刷新数据</button>
					</div>
				</div>

				<!-- 提示词库 -->
				<div class="tab-pane" id="tab-prompts">
					<div
						style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
						<h3 style="color: #333;">📝 快捷提示词</h3>
						<button class="btn-save" onclick="showAddPromptModal()"
							style="padding: 8px 16px; font-size: 13px;">+ 新建提示词</button>
					</div>
					<div id="prompts-list" style="display: flex; flex-direction: column; gap: 12px;">
						<div style="text-align: center; padding: 40px; color: #999;">加载中...</div>
					</div>
				</div>
			</div>

			<div style="display: flex; justify-content: center; gap: 20px; margin-top: 30px;">
				<button class="btn-save" onclick="saveAllSettings()">💾 保存全部设置</button>
				<button class="btn-save" style="background: #6c757d;" onclick="resetSettings()">↺ 恢复默认</button>
			</div>
		</div>

		<!-- 提示词模态框 -->
		<div id="prompt-modal" class="modal">
			<div class="modal-content">
				<div class="modal-header">
					<h3 id="prompt-modal-title">新建提示词</h3>
					<button class="close-modal" onclick="closePromptModal()">×</button>
				</div>
				<div class="modal-body">
					<div class="form-group">
						<label>标题</label>
						<input type="text" id="prompt-title" placeholder="例如：翻译助手">
					</div>
					<div class="form-group">
						<label>提示词内容</label>
						<textarea id="prompt-content" rows="5" placeholder="输入提示词内容..."></textarea>
					</div>
					<div class="form-group">
						<label>分类</label>
						<select id="prompt-category">
							<option value="general">通用</option>
							<option value="coding">编程</option>
							<option value="writing">写作</option>
							<option value="translation">翻译</option>
						</select>
					</div>
					<input type="hidden" id="prompt-id">
					<div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
						<button class="btn-save" onclick="savePrompt()" style="padding: 8px 20px;">保存</button>
						<button class="btn-save" onclick="closePromptModal()"
							style="background: #6c757d; padding: 8px 20px;">取消</button>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
		<script>
			const csrftoken = getCookie('csrftoken');

			function getCookie(name) {
				const value = `; ${document.cookie}`;
				const parts = value.split(`; ${name}=`);
				if (parts.length === 2) return parts.pop().split(';').shift();
				return '';
			}

			function showToast(message, type = 'success') {
				const toast = document.createElement('div');
				toast.className = 'toast';
				toast.textContent = message;
				toast.style.background = type === 'success' ? '#4caf50' : '#f44336';
				document.body.appendChild(toast);
				setTimeout(() => toast.remove(), 3000);
			}

			// 标签页切换
			document.querySelectorAll('.tab-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
					document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
					btn.classList.add('active');
					document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
				});
			});

			// 滑块显示值
			document.getElementById('temperature').addEventListener('input', (e) => {
				document.getElementById('temperature-value').textContent = e.target.value;
			});
			document.getElementById('top-p').addEventListener('input', (e) => {
				document.getElementById('top-p-value').textContent = e.target.value;
			});

			// 测试API Key
			async function testApiKey(provider) {
				const apiKey = document.getElementById('deepseek-api-key').value;
				if (!apiKey) {
					showToast('请先填写 API Key', 'error');
					return;
				}
				showToast('正在测试连接...', 'success');
				try {
					const response = await fetch('/api/config/test/', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'X-CSRFToken': csrftoken
						},
						body: JSON.stringify({
							provider: provider,
							api_key: apiKey
						})
					});
					const result = await response.json();
					if (result.success) {
						showToast('连接成功！', 'success');
					} else {
						showToast('连接失败：' + result.error, 'error');
					}
				} catch (error) {
					showToast('测试失败', 'error');
				}
			}

			// 保存所有设置
			async function saveAllSettings() {
				const settings = [{
						key: 'project_name',
						value: document.getElementById('project-name').value,
						value_type: 'str'
					},
					{
						key: 'default_greeting',
						value: document.getElementById('default-greeting').value,
						value_type: 'str'
					},
					{
						key: 'auto_save',
						value: document.getElementById('auto-save').checked,
						value_type: 'bool'
					},
					{
						key: 'stream_mode',
						value: document.getElementById('stream-mode').checked,
						value_type: 'bool'
					},
					{
						key: 'deepseek_api_key',
						value: document.getElementById('deepseek-api-key').value,
						value_type: 'str'
					},
					{
						key: 'default_model',
						value: document.getElementById('default-model').value,
						value_type: 'str'
					},
					{
						key: 'enable_agent',
						value: document.getElementById('enable-agent').checked,
						value_type: 'bool'
					},
					{
						key: 'temperature',
						value: document.getElementById('temperature').value,
						value_type: 'str'
					},
					{
						key: 'top_p',
						value: document.getElementById('top-p').value,
						value_type: 'str'
					},
					{
						key: 'max_tokens',
						value: document.getElementById('max-tokens').value,
						value_type: 'int'
					},
					{
						key: 'theme_color',
						value: document.getElementById('theme-color').value,
						value_type: 'str'
					},
					{
						key: 'bubble_style',
						value: document.getElementById('bubble-style').value,
						value_type: 'str'
					},
					{
						key: 'code_highlight',
						value: document.getElementById('code-highlight').checked,
						value_type: 'bool'
					}
				];
				try {
					const response = await fetch('/api/settings/batch/', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'X-CSRFToken': csrftoken
						},
						body: JSON.stringify({
							settings: settings
						})
					});
					const result = await response.json();
					if (result.success) {
						showToast('设置保存成功！', 'success');
					} else {
						showToast('保存失败：' + result.error, 'error');
					}
				} catch (error) {
					showToast('保存失败', 'error');
				}
			}

			// 恢复默认
			function resetSettings() {
				if (confirm('确定恢复所有默认设置吗？')) {
					document.getElementById('project-name').value = '灵枢';
					document.getElementById('default-greeting').value = '你好！很高兴为你服务';
					document.getElementById('auto-save').checked = true;
					document.getElementById('stream-mode').checked = true;
					document.getElementById('deepseek-api-key').value = '';
					document.getElementById('default-model').value = 'deepseek-chat';
					document.getElementById('enable-agent').checked = false;
					document.getElementById('temperature').value = '0.7';
					document.getElementById('temperature-value').textContent = '0.7';
					document.getElementById('top-p').value = '0.9';
					document.getElementById('top-p-value').textContent = '0.9';
					document.getElementById('max-tokens').value = '1024';
					document.getElementById('theme-color').value = 'purple';
					document.getElementById('bubble-style').value = 'rounded';
					document.getElementById('code-highlight').checked = true;
					showToast('已恢复默认设置', 'success');
				}
			}

			// 加载已有设置
			async function loadSettings() {
				try {
					const response = await fetch('/api/settings/load/');
					const data = await response.json();
					if (data.success && data.data) {
						const s = data.data;
						if (s.project_name) document.getElementById('project-name').value = s.project_name;
						if (s.default_greeting) document.getElementById('default-greeting').value = s.default_greeting;
						if (s.auto_save !== undefined) document.getElementById('auto-save').checked = s.auto_save;
						if (s.stream_mode !== undefined) document.getElementById('stream-mode').checked = s.stream_mode;
						if (s.deepseek_api_key) document.getElementById('deepseek-api-key').value = s.deepseek_api_key;
						if (s.default_model) document.getElementById('default-model').value = s.default_model;
						if (s.enable_agent !== undefined) document.getElementById('enable-agent').checked = s.enable_agent;
						if (s.temperature) {
							document.getElementById('temperature').value = s.temperature;
							document.getElementById('temperature-value').textContent = s.temperature;
						}
						if (s.top_p) {
							document.getElementById('top-p').value = s.top_p;
							document.getElementById('top-p-value').textContent = s.top_p;
						}
						if (s.max_tokens) document.getElementById('max-tokens').value = s.max_tokens;
						if (s.theme_color) document.getElementById('theme-color').value = s.theme_color;
						if (s.bubble_style) document.getElementById('bubble-style').value = s.bubble_style;
						if (s.code_highlight !== undefined) document.getElementById('code-highlight').checked = s
							.code_highlight;
					}
				} catch (error) {
					console.error('加载设置失败:', error);
				}
			}

			// ========== 统计看板 ==========
			let chatChart = null;

			async function refreshStats() {
				try {
					const response = await fetch('/api/stats/');
					const result = await response.json();
					if (result.success) {
						document.getElementById('stat-total-chats').textContent = result.data.total_chats || 0;
						document.getElementById('stat-total-messages').textContent = result.data.total_messages || 0;
						document.getElementById('stat-average-length').textContent = result.data.avg_message_length || 0;
						drawCharts(result.data);
					}
				} catch (error) {
					console.error('加载统计数据失败:', error);
				}
			}

			function drawCharts(data) {
				const ctx = document.getElementById('chat-chart').getContext('2d');
				if (chatChart) {
					chatChart.destroy();
				}
				chatChart = new Chart(ctx, {
					type: 'line',
					data: {
						labels: data.week_data?.map(d => d.date) || ['暂无数据'],
						datasets: [{
							label: '对话数量',
							data: data.week_data?.map(d => d.count) || [0],
							borderColor: '#667eea',
							backgroundColor: 'rgba(102, 126, 234, 0.1)',
							tension: 0.3,
							fill: true
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: true,
						plugins: {
							legend: {
								position: 'top'
							}
						}
					}
				});
			}

			// ========== 提示词库 ==========
			async function loadPrompts() {
				try {
					const response = await fetch('/api/prompts/');
					const result = await response.json();
					if (result.success) {
						renderPrompts(result.data);
					}
				} catch (error) {
					console.error('加载提示词失败:', error);
				}
			}

			function renderPrompts(prompts) {
				const container = document.getElementById('prompts-list');
				if (!prompts || prompts.length === 0) {
					container.innerHTML =
						'<div style="text-align: center; padding: 40px; color: #999;">暂无提示词，点击"新建提示词"开始创建</div>';
					return;
				}
				container.innerHTML = prompts.map(p => `
                <div class="prompt-card">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div style="flex: 1;">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                                <strong style="font-size: 16px;">${escapeHtml(p.title)}</strong>
                                <span class="category-badge">${p.category}</span>
                            </div>
                            <div style="color: #666; font-size: 13px; line-height: 1.5;">${escapeHtml(p.content.substring(0, 100))}${p.content.length > 100 ? '...' : ''}</div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="icon-btn" onclick="usePrompt('${p.id}')" style="background: #28a745; color: white;">使用</button>
                            <button class="icon-btn" onclick="editPrompt('${p.id}')" style="background: #ffc107; color: #333;">编辑</button>
                            <button class="icon-btn" onclick="deletePrompt('${p.id}')" style="background: #dc3545; color: white;">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
			}

			function showAddPromptModal() {
				document.getElementById('prompt-modal-title').textContent = '新建提示词';
				document.getElementById('prompt-id').value = '';
				document.getElementById('prompt-title').value = '';
				document.getElementById('prompt-content').value = '';
				document.getElementById('prompt-category').value = 'general';
				document.getElementById('prompt-modal').style.display = 'flex';
			}

			function closePromptModal() {
				document.getElementById('prompt-modal').style.display = 'none';
			}

			async function savePrompt() {
				const id = document.getElementById('prompt-id').value;
				const data = {
					title: document.getElementById('prompt-title').value,
					content: document.getElementById('prompt-content').value,
					category: document.getElementById('prompt-category').value
				};
				if (!data.title || !data.content) {
					showToast('请填写标题和内容', 'error');
					return;
				}
				const url = id ? `/api/prompts/${id}/` : '/api/prompts/';
				const method = id ? 'PUT' : 'POST';
				try {
					const response = await fetch(url, {
						method: method,
						headers: {
							'Content-Type': 'application/json',
							'X-CSRFToken': csrftoken
						},
						body: JSON.stringify(data)
					});
					const result = await response.json();
					if (result.success) {
						showToast(result.message, 'success');
						closePromptModal();
						loadPrompts();
					} else {
						showToast(result.error, 'error');
					}
				} catch (error) {
					showToast('保存失败', 'error');
				}
			}

			async function editPrompt(id) {
				try {
					const response = await fetch(`/api/prompts/${id}/`);
					const result = await response.json();
					if (result.success) {
						const p = result.data;
						document.getElementById('prompt-modal-title').textContent = '编辑提示词';
						document.getElementById('prompt-id').value = p.id;
						document.getElementById('prompt-title').value = p.title;
						document.getElementById('prompt-content').value = p.content;
						document.getElementById('prompt-category').value = p.category;
						document.getElementById('prompt-modal').style.display = 'flex';
					}
				} catch (error) {
					showToast('加载失败', 'error');
				}
			}

			async function deletePrompt(id) {
				if (!confirm('确定删除这个提示词吗？')) return;
				try {
					const response = await fetch(`/api/prompts/${id}/`, {
						method: 'DELETE',
						headers: {
							'X-CSRFToken': csrftoken
						}
					});
					const result = await response.json();
					if (result.success) {
						showToast('删除成功', 'success');
						loadPrompts();
					} else {
						showToast(result.error, 'error');
					}
				} catch (error) {
					showToast('删除失败', 'error');
				}
			}

			async function usePrompt(id) {
				try {
					const response = await fetch(`/api/prompts/${id}/`);
					const result = await response.json();
					if (result.success) {
						navigator.clipboard.writeText(result.data.content);
						showToast('已复制到剪贴板，粘贴到主界面即可使用', 'success');
					}
				} catch (error) {
					showToast('加载失败', 'error');
				}
			}

			function escapeHtml(text) {
				const div = document.createElement('div');
				div.textContent = text;
				return div.innerHTML;
			}

			// 页面加载
			loadSettings();
			loadPrompts();
			refreshStats();
		</script>
	</body>
</html>
