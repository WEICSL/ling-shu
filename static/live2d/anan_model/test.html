<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live2D 本地最终版</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        canvas { position: fixed; right: 0; bottom: 0; width: 500px; height: 600px; border: 1px solid #444; background: #000; }
        #log {
            position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8);
            color: #0f0; padding: 12px; font-family: monospace; font-size: 12px;
            border-radius: 8px; z-index: 10000;
        }
    </style>
    <!-- 全部使用本地文件：顺序很重要 -->
    <script src="/live2dsdk/pixi.min.js"></script>
    <script src="/live2dsdk/live2dcubismcore.min.js"></script>
    <script src="/live2dsdk/pixi-live2d-display.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="log">初始化本地模型...</div>
    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            logDiv.innerHTML += `<br>✅ ${msg}`;
            console.log(msg);
        }

        // 使用你改好名字的本地模型
        // 【重要】请确保这个路径正确，且文件名已经去掉空格
        const MODEL_PATH = 'AnAn-model.model3.json';

        window.onload = async () => {
            try {
                if (typeof PIXI === 'undefined') throw new Error('PixiJS 未加载');
                log('PixiJS 已加载');

                const app = new PIXI.Application({
                    view: document.getElementById('canvas'),
                    width: 600,
                    height: 600,
                    backgroundColor: 0x1a1a2e,
                    transparent: true
                });
                log('Pixi 应用创建成功');

                log(`加载模型: ${MODEL_PATH}`);
                const model = await PIXI.Live2DModel.from(MODEL_PATH);
                model.x = 300;
                model.y = 520;
                model.scale.set(0.2);
                app.stage.addChild(model);

                log('🎉 模型加载成功！');
            } catch (err) {
                log(`❌ 错误: ${err.message}`);
                console.error(err);
            }
        };
    </script>
</body>
</html>
